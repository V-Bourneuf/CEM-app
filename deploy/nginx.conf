# nginx reverse proxy for CEM App on EC2.
#
# Initial state: HTTP-only on port 80, proxying to Node on 127.0.0.1:1337.
# certbot --nginx will automatically add a 443 server block with the
# Let's Encrypt cert and redirect 80 → 443 when the setup script runs it.
#
# Manual install (handled by deploy/setup-ec2.sh):
#   On Amazon Linux 2023:  copy to /etc/nginx/conf.d/cemapp.conf
#   On Ubuntu/Debian:      copy to /etc/nginx/sites-available/cemapp + symlink to sites-enabled

server {
    listen      80;
    server_name cemapp.example.com;            # ← rewritten by setup-ec2.sh

    # Let's Encrypt ACME HTTP-01 challenge — must remain accessible over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Reverse proxy everything else to Node
    client_max_body_size 1m;
    proxy_read_timeout   30s;
    proxy_send_timeout   30s;

    location / {
        proxy_pass         http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # SAML 302 responses include a long Location header (base64 SAMLRequest)
        # — bump proxy buffers so nginx doesn't truncate them.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }

    access_log /var/log/nginx/cemapp.access.log;
    error_log  /var/log/nginx/cemapp.error.log warn;
}
